name: Preview uitrollen

# Het tweede deel van de preview per pull request. De job "Preview" in uitrollen.yml
# bouwt de PR zonder sleutels en bewaart dist als artifact. Deze workflow draait daarna,
# altijd in de versie van main (zo werkt workflow_run), en is de enige die de
# preview-sleutel ziet. Daarom mag de omgeving preview tot main beperkt zijn, en kan
# code uit een PR nooit bij een Cloudflare-sleutel.
#
# Wat hier gebeurt, vertrouwt niets uit de PR: de code en de installatie komen van
# main, het artifact wordt alleen uitgepakt naar dist/ en er draait niets uit, en het
# PR-nummer komt uit de gebeurtenis van GitHub, niet uit het artifact.
on:
  workflow_run:
    workflows: [Uitrollen]
    types: [completed]

concurrency:
  group: preview-uitrollen-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Preview
    # Alleen een geslaagde run voor een PR uit deze repo: een fork krijgt geen preview.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: PR-nummer bepalen
        id: pr
        env:
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if ! [[ "$PR" =~ ^[0-9]+$ ]]; then
            echo "::notice::Deze run hoort niet bij een pull request uit deze repo. Er komt geen preview."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "nummer=$PR" >> "$GITHUB_OUTPUT"
          fi

      - name: Is er iets gebouwd?
        id: artifact
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # De PR-job bewaart niets als de preview-instellingen ontbreken; hij meldt dat zelf al.
          aantal=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "preview-dist" and (.expired | not))] | length')
          if [ "$aantal" = "0" ]; then
            echo "::notice::De run van de PR heeft geen gebouwde preview bewaard. Er komt geen preview."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Is alles ingericht?
        id: check
        if: steps.pr.outputs.skip != 'true' && steps.artifact.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN ontbreekt in omgeving preview. Er komt geen preview voor deze PR."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "klaar=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.klaar == 'true'
        uses: actions/checkout@v7
        with:
          ref: main

      - if: steps.check.outputs.klaar == 'true'
        uses: pnpm/action-setup@v6

      - if: steps.check.outputs.klaar == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Installeren (versie van main)
        if: steps.check.outputs.klaar == 'true'
        run: |
          node -e "import('./scripts/lib/cloudflare-config.mjs').then((m) => m.cloudflareConfig())"
          pnpm install --frozen-lockfile

      # Pas na de installatie, en alleen naar dist/: niets uit de PR komt in node_modules,
      # de config of de scripts terecht.
      - name: Gebouwde PR ophalen
        if: steps.check.outputs.klaar == 'true'
        uses: actions/download-artifact@v8
        with:
          name: preview-dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Preview uploaden
        id: upload
        if: steps.check.outputs.klaar == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          PR: ${{ steps.pr.outputs.nummer }}
        run: |
          pnpm exec wrangler versions upload --preview-alias "pr-$PR" | tee upload.log
          url=$(grep -oE 'https://pr-[0-9]+-[^ ]+\.workers\.dev' upload.log | head -n 1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Link in de PR zetten
        if: steps.check.outputs.klaar == 'true' && steps.upload.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          URL: ${{ steps.upload.outputs.url }}
          PR: ${{ steps.pr.outputs.nummer }}
        run: |
          # Eén reactie per PR, die bij elke push wordt bijgewerkt.
          markering='<!-- cloudflare-preview -->'
          tekst="$markering
          Cloudflare-preview: $URL

          Deze link staat achter dezelfde login als productie en toont de testbalk."
          bestaand=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$markering\")) | .id" | head -n 1)
          if [ -n "$bestaand" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$bestaand" -f body="$tekst" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$tekst" > /dev/null
          fi
