name: Proef toegang bijwerken

# Maakt de Access-policies gelijk aan beheer/toegang.json en trekt de toegang in van
# wie er niet meer in staat (ban en afmelden in Supabase). Draait vanzelf als
# toegang.json op main verandert, of met de hand. Nooit op een pull request: de
# sleutels staan in de omgeving proef-beheer, die beperkt is tot main.
on:
  push:
    branches: [main]
    paths:
      - beheer/toegang.json
  workflow_dispatch:
    inputs:
      droogloop:
        description: Alleen controleren, niets wijzigen
        type: boolean
        default: false

concurrency:
  group: proef-beheer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  toegang:
    name: Toegang bijwerken
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: proef-beheer
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Policies gelijkzetten en toegang intrekken
        env:
          CLOUDFLARE_PROEF_TOKEN: ${{ secrets.CLOUDFLARE_PROEF_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ORG_SLUG: ${{ secrets.SUPABASE_ORG_SLUG }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_TEAM_DOMAIN: ${{ vars.CLOUDFLARE_TEAM_DOMAIN }}
          CLOUDFLARE_GROEPEN_IDP: ${{ vars.CLOUDFLARE_GROEPEN_IDP }}
          DROOGLOOP: ${{ inputs.droogloop }}
        run: |
          args=(--toegang)
          if [ "$DROOGLOOP" = "true" ]; then args+=(--droogloop); fi
          node beheer/inrichten-cloudflare.mjs "${args[@]}"
